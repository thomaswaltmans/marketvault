[project]
name = "marketvault"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.0,<7.0",
    "pandas>=2.0",
    "scipy>=1.17",
    "yfinance>=0.2",
    "openpyxl>=3.1",
    "dj-database-url>=2.1",
    "gunicorn>=22.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
    "django-ratelimit>=4.1",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "ruff>=0.6",
]

[tool.black]
# Without this black infers every version allowed by requires-python and then
# cannot AST-verify its own output on 3.13.
target-version = ["py313"]

[tool.ruff]
# Auto-generated by makemigrations; not ours to lint.
exclude = ["portfolio/migrations"]

[tool.ruff.lint]
# Pinned so the rule set does not shift when ruff is upgraded.
select = ["E4", "E7", "E9", "F", "I"]
